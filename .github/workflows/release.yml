name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"
env:
    PLUGIN_NAME: focus-time

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"

            - name: Build plugin
              run: |
                  npm install --legacy-peer-deps --no-audit --no-fund
                  npm run build

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  zip "$PLUGIN_NAME-$tag.zip" main.js manifest.json styles.css
                  args=(--title "$tag" --draft)
                  if [ -f "docs/releases/$tag.md" ]; then
                    args+=(--notes-file "docs/releases/$tag.md")
                  else
                    args+=(--generate-notes)
                  fi
                  gh release create "$tag" "${args[@]}" \
                    main.js manifest.json styles.css "$PLUGIN_NAME-$tag.zip"
